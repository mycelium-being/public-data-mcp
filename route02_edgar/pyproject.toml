[project]
name = "edgar-mcp"
version = "0.1.0"
description = "MCP server: yearly ratio of two XBRL tags for one SEC filer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp<2",
]

[project.scripts]
edgar-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
