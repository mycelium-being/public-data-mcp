[project]
name = "route01-ecfr"
version = "0.1.0"
description = "MCP server: eCFR section text as of two dates, with a unified diff"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp<2",
]

[project.scripts]
ecfr-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
